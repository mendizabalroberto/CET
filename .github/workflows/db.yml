# =============================================================================
# DB — migraciones y pgTAP contra un Postgres efímero
# © 2026 Roberto Mendizabal. Todos los derechos reservados.
#
# Este workflow existe para responder a una pregunta antes de cada merge:
#   "¿Se aplican estas migraciones desde cero, y siguen las RLS impidiendo que
#    un colegio lea los datos de otro?"
#
# Se ejecuta contra un Postgres LOCAL Y DESECHABLE, nunca contra el proyecto
# `clcutoqjdgeggvgyreud`. Un CI con credenciales de producción es un CI que,
# antes o después, borra producción.
#
# NOTA DE PROPIEDAD: `supabase/` pertenece a la vía A. Este workflow es el
# contrato de CI que la vía E (deployment) le ofrece; si la estructura de
# `supabase/migrations` o `supabase/tests` cambia, hay que ajustar los pasos.
# =============================================================================
name: DB

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  workflow_dispatch:

concurrency:
  group: db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrations:
    name: Migraciones + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Postgres 17: la misma versión mayor que usa Supabase (MASTER_PLAN §3).
        # Probar contra otra versión es probar otra base de datos.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente de Postgres y pg_prove
        run: |
          set -euo pipefail
          sudo apt-get update
          # En el RUNNER solo hacen falta dos cosas: `psql` para hablar con la
          # base de datos y `pg_prove` para interpretar la salida TAP.
          # Se usa el metapaquete `postgresql-client`, no `postgresql-client-17`:
          # el protocolo es compatible entre versiones y `-17` no está en los
          # repositorios por defecto de Ubuntu, así que fijarlo aquí rompería el
          # CI en cuanto GitHub cambiara de imagen base.
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            libtap-parser-sourcehandler-pgtap-perl
        # La EXTENSIÓN pgTAP, en cambio, tiene que existir DENTRO del contenedor
        # de Postgres, que es donde corren los tests. Ver el paso siguiente.

      - name: Habilitar pgTAP dentro del contenedor de Postgres
        run: |
          set -euo pipefail
          # El contenedor `postgres:17` no trae pgTAP. Se instala dentro de él,
          # que es donde la extensión tiene que existir para poder crearse.
          CONTAINER=$(docker ps --filter "ancestor=postgres:17" --format "{{.ID}}" | head -n1)
          if [ -z "$CONTAINER" ]; then
            echo "::error::No se encontró el contenedor de Postgres."
            exit 1
          fi
          docker exec "$CONTAINER" bash -lc "apt-get update -qq && apt-get install -y -qq postgresql-17-pgtap"
          psql -v ON_ERROR_STOP=1 -c "create extension if not exists pgtap;"

      - name: Lo que Supabase provee y un postgres:17 desnudo no
        run: |
          set -euo pipefail
          # EL ESQUEMA `extensions` ES LO QUE FALTABA, y por eso este workflow
          # no había pasado nunca: moría en la primera migración con
          #
          #   0001_extensions.sql:25: ERROR: schema "extensions" does not exist
          #
          # dejando sin ejecutar los pasos de RLS y de pgTAP. Un CI en rojo que
          # nadie mira es peor que no tener CI: da la sensación de estar cubierto.
          #
          # Antes este paso creaba pgcrypto y citext SIN esquema, es decir en
          # `public`. Las dos primeras líneas de 0001 parecían pasar por eso
          # mismo: `create extension if not exists ... with schema extensions`
          # NO mueve una extensión que ya existe, ni avisa — solo dice "skipping".
          # La tercera, pg_trgm, era la primera que no existía todavía, y fue la
          # que destapó el problema. De haber pasado, habría reventado más tarde
          # y peor: `app.sha256_hex()` llama a `extensions.digest()`, que con
          # pgcrypto en `public` no existe.
          #
          # Así que aquí se crea SOLO lo que el entorno gestionado ya trae, y en
          # el esquema donde Supabase lo pone. Las extensiones que el esquema
          # necesita las declaran las migraciones, que es donde deben estar.
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists extensions;
          grant usage on schema extensions to public;
          -- uuid-ossp viene con el proyecto de Supabase y ninguna migración la
          -- declara. Si algún día una la necesita, que la declare ella.
          create extension if not exists "uuid-ossp" with schema extensions;
          SQL

      - name: El esquema `extensions` está donde debe
        run: |
          set -euo pipefail
          # Comprobación explícita ANTES de las migraciones. Sin ella, el fallo
          # aparece a mitad de un volcado de 20 ficheros y cuesta leerlo.
          psql -v ON_ERROR_STOP=1 -t -A -c "
            select case
              when exists (select 1 from pg_namespace where nspname = 'extensions')
              then 'ok'
              else 'FALTA el esquema extensions'
            end" | grep -qx ok

      - name: Sustituto mínimo de GoTrue (`auth`) y los roles de PostgREST
        run: |
          set -euo pipefail
          # Las migraciones asumen tres cosas del entorno gestionado que un
          # postgres:17 no trae: los roles anon/authenticated/service_role, el
          # esquema `auth` con su tabla `users`, y `auth.uid()`.
          #
          # Se reproduce lo MÍNIMO y de forma fiel. "Fiel" importa más que
          # "completo": si `auth.uid()` leyera el sub de otro sitio que no fuera
          # `request.jwt.claims`, los tests de RLS pasarían aquí y las políticas
          # seguirían rotas en producción. Sería un verde falso, que es lo único
          # peor que un rojo.
          #
          # No se inventa nada más. Si mañana una migración necesita
          # `auth.jwt()` o `storage`, que falle aquí y se añada a conciencia:
          # este fichero debe declarar todo lo que el esquema da por supuesto.
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              -- bypassrls, igual que en Supabase: es el rol del backend.
              create role service_role nologin noinherit bypassrls;
            end if;
          end $$;

          create schema if not exists auth;

          -- Solo las columnas que el esquema y los seeds tocan de verdad.
          -- `raw_app_meta_data` la escribe app.sync_role_claims() (0020).
          create table if not exists auth.users (
            id                 uuid primary key,
            email              text,
            encrypted_password text,
            raw_app_meta_data  jsonb not null default '{}'::jsonb,
            raw_user_meta_data jsonb not null default '{}'::jsonb,
            created_at         timestamptz not null default now()
          );

          -- EL corazón de todas las políticas RLS. Lee exactamente de donde lee
          -- la de Supabase: el GUC que fija PostgREST con los claims del JWT.
          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $fn$
            select nullif(
              current_setting('request.jwt.claims', true)::jsonb ->> 'sub', ''
            )::uuid
          $fn$;

          grant usage on schema auth to anon, authenticated, service_role;
          grant execute on function auth.uid() to anon, authenticated, service_role;
          grant select on auth.users to service_role;
          SQL

      - name: Aplicar migraciones en orden estricto
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No hay migraciones todavía (la vía A aún no ha entregado). Nada que validar."
            exit 0
          fi
          # Orden lexicográfico = orden cronológico, por el prefijo de timestamp
          # que impone el CLI de Supabase.
          for file in "${files[@]}"; do
            echo "── aplicando $file"
            # ON_ERROR_STOP: una migración que falla a la mitad debe romper el
            # CI, no dejar la base de datos a medias y continuar.
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Verificar que TODA tabla de negocio tiene RLS
        run: |
          set -euo pipefail
          # Comprobación transversal, independiente de que alguien se acuerde de
          # escribir el test: DATA_MODEL §0 dice "toda tabla lleva RLS, sin
          # excepción". Aquí se demuestra en vez de confiar.
          UNPROTECTED=$(psql -tAX -c "
            select coalesce(string_agg(c.relname, ', '), '')
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relkind = 'r'
              and not c.relrowsecurity;
          ")
          if [ -n "$UNPROTECTED" ]; then
            echo "::error::Tablas sin RLS en el esquema public: $UNPROTECTED"
            exit 1
          fi
          echo "Todas las tablas de public tienen RLS habilitada."

      # LOS SEEDS NO SE EJECUTAN AQUÍ, Y ES DELIBERADO.
      #
      # `supabase/seed/*.sql` no siembra un esquema: ATA filas de `public` a
      # cuentas que ya existen en GoTrue. `0001_superadmin.sql` aborta a
      # propósito si no encuentra su usuario en `auth.users`, y
      # `0004_demo_students.sql` exige fichas con un `pin_hash` Argon2id que solo
      # produce un script fuera de Postgres.
      #
      # Inventar aquí esas filas para que el paso saliera verde no demostraría
      # nada de los seeds: demostraría que sé escribir INSERTs. Los seeds se
      # verifican donde tienen sentido, contra un proyecto con Auth de verdad.
      #
      # Los tests pgTAP no los necesitan: traen su propio mundo en
      # `helpers/fixture.psql`, que se crea y se deshace dentro de cada
      # transacción.

      - name: Ejecutar pgTAP
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(supabase/tests/*.sql)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::warning::Aún no hay tests pgTAP."
            exit 0
          fi
          # pg_prove devuelve código distinto de 0 si algún test falla, que es
          # lo que hace que este job sea útil.
          pg_prove --ext .sql --verbose "${tests[@]}"
